<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <style>
    .bg { fill: #ffffff } .t { fill: #1d1d1f } .s { fill: #6e6e73 } .track { fill: #f5f5f7 }
    @media (prefers-color-scheme: dark) { .bg { fill: #000000 } .t { fill: #f5f5f7 } .s { fill: #a1a1a6 } .track { fill: #1d1d1f } }
  </style>
  <rect class="bg" width="880" height="300" rx="24"/>
  <text class="s" x="48" y="64" font-size="17" font-weight="600" letter-spacing="0.5">MEASURED LATENCY · MAC TO TABLET</text>
  <text class="t" x="48" y="128" font-size="64" font-weight="700" letter-spacing="-1.5">~45 ms</text>
  <text class="s" x="300" y="112" font-size="19">average, from the moment the Mac draws a frame</text>
  <text class="s" x="300" y="136" font-size="19">to the moment the tablet shows it.</text>
  <!-- stacked bar: 45 ms total = 780 px -->
  <rect class="track" x="48" y="172" width="784" height="28" rx="14"/>
  <rect x="48" y="172" width="104" height="28" rx="14" fill="#0071e3"/>
  <rect x="138" y="172" width="173" height="28" fill="#2997ff"/>
  <rect x="311" y="172" width="521" height="28" rx="14" fill="#86c5ff"/>
  <rect x="311" y="172" width="20" height="28" fill="#86c5ff"/>
  <rect x="48" y="220" width="12" height="12" rx="3" fill="#0071e3"/><text class="t" x="68" y="234" font-size="17" font-weight="600">6 ms</text>
  <text class="s" x="68" y="258" font-size="15">Capture + HEVC encode</text>
  <rect x="340" y="220" width="12" height="12" rx="3" fill="#2997ff"/><text class="t" x="360" y="234" font-size="17" font-weight="600">10 ms</text>
  <text class="s" x="360" y="258" font-size="15">Network send</text>
  <rect x="560" y="220" width="12" height="12" rx="3" fill="#86c5ff"/><text class="t" x="580" y="234" font-size="17" font-weight="600">~29 ms</text>
  <text class="s" x="580" y="258" font-size="15">Wi-Fi + hardware decode + display</text>
</svg>
